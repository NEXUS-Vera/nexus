[project]
name = "nexus-persistence"
version = "0.0.0"
description = "Project package persistence for Nexus (in-memory and PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Alembic loads these by path at runtime rather than importing them, so they
# are not modules setuptools would find on its own; an installed package
# without them cannot migrate the database it is pointed at.
[tool.setuptools.package-data]
nexus_persistence = [
  "alembic/*.py",
  "alembic/*.mako",
  "alembic/versions/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
