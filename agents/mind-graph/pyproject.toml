[project]
name = "mindgraph"
version = "0.1.0"
description = "Nexus Mind Graph — ledger, projector, retrieval, agents"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "networkx>=3", "cryptography>=42"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
mg = "mindgraph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
