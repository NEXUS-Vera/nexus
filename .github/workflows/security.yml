name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  security-basics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked secrets and env files
        run: |
          chmod +x scripts/check-repository-policy.sh
          ./scripts/check-repository-policy.sh

      - name: Scan for high-risk secret patterns in tracked text files
        run: |
          chmod +x scripts/scan-secret-patterns.sh
          ./scripts/scan-secret-patterns.sh
