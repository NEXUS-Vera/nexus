name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime + test deps required by apps/api, embedded-systems, and
          # packages/contracts generation tests. Fixture paths must not need
          # live credentials.
          python -m pip install \
            pytest \
            pytest-asyncio \
            jsonschema \
            httpx \
            fastapi \
            "uvicorn[standard]" \
            pydantic \
            pyyaml \
            "datamodel-code-generator>=0.26.0"

      - name: Run Python tests when present
        run: |
          chmod +x scripts/run-tests.sh
          ./scripts/run-tests.sh unit
          ./scripts/run-tests.sh integration
