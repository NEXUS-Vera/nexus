name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime + test deps required by apps/api, embedded-systems,
          # mind-graph, and packages/contracts generation tests.
          # Fixture/fake-model paths must not need live credentials.
          python -m pip install \
            pytest \
            pytest-asyncio \
            jsonschema \
            httpx \
            fastapi \
            "uvicorn[standard]" \
            pydantic \
            pyyaml \
            sqlalchemy \
            "psycopg[binary]" \
            alembic \
            "datamodel-code-generator>=0.26.0" \
            "networkx>=3" \
            "scipy>=1.11" \
            "cryptography>=42"

      - name: Migrate Postgres for store contract tests
        env:
          NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
        run: |
          cd packages/persistence
          PYTHONPATH=src python -m alembic -c alembic.ini upgrade head

      - name: Run Python tests when present
        env:
          NEXUS_INITIALIZATION_PROVIDER: fixture
          NEXUS_STORAGE_BACKEND: memory
          NEXUS_TEST_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
        run: |
          chmod +x scripts/run-tests.sh
          ./scripts/run-tests.sh unit
          ./scripts/run-tests.sh integration
