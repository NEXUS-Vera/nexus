- id: adversarial-cp-named-parts
  category: greenhouse-sensing-node
  prompt: >-
    Greenhouse node that measures temperature with a DHT22 and ESP32 and
    reports remotely.
  expectedOutcome: supported
  expectedMaturity: roles-defined
  minRoleCount: 1
  requireSensorRole: true
  forbiddenSelections:
    - DHT22
    - ESP32
