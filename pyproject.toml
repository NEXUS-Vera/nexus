[project]
name = "nexus"
version = "0.0.0"
description = "Modular monorepo for the Nexus agentic engineering platform (foundation only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.16.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=0.23.0",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "alembic>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agents", "apps", "packages", "tools", "scripts"]
extend-exclude = [
  "packages/contracts/generated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = [
  "agents",
  "apps",
  "packages",
  "tools",
  "evals",
]
python_files = ["test_*.py"]
pythonpath = [
  "apps/api/src",
  "agents/embedded-systems/src",
  "packages/board/src",
  "packages/board/tests",
  "packages/contracts/src",
  "packages/contracts/generated/python",
  "packages/circuit-simulation/src",
  "packages/model-gateway/src",
  "packages/observability/src",
  "packages/persistence/src",
]
addopts = "-q"
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["agents", "apps", "packages", "tools", "scripts"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules", "packages/contracts/generated"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["agents", "apps", "packages", "tools", "scripts"]
exclude = "packages/contracts/generated/"
